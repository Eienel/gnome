name: Fly Deploy

# Deploys the rail to Fly.io. Requires a FLY_API_TOKEN repository secret
# (create with: flyctl tokens create deploy) and a one-time app + volume +
# secrets setup (see README "Deploy"). Runtime secrets live in Fly, not here.
on:
  push:
    branches: [claude/robinhood-mainnet-evm-0huqbl, main]
    paths-ignore:
      - "design/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
